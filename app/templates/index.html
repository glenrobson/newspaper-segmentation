<!-- app/templates/index.html -->
% rebase('layout.html', title='Newspaper Segmentation')


<div class="home-wrap">
  <h1>Newspaper Segmentation</h1>
  <p>Enter a IIIF manifest URL or choose an example below.</p>

  <div class="manifest-form">
    <input id="manifest-url-input" type="text" placeholder="https://example.org/manifest.json">
    <button onclick="goToManifest()">Open</button>
  </div>

  <div class="examples">
    <h2>Examples</h2>
    <ul class="example-list" id="example-list">
      <li><em>Loading…</em></li>
    </ul>
  </div>
</div>

<script>
  function goToManifest(url) {
    const manifestUrl = url || document.getElementById('manifest-url-input').value.trim();
    if (!manifestUrl) return;
    window.location.href = '/segmentation?iiif-content=' + encodeURIComponent(manifestUrl);
  }

  document.getElementById('manifest-url-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') goToManifest();
  });

  async function loadExamples() {
    const res = await fetch('/api/manifests');
    const manifests = await res.json();
    const list = document.getElementById('example-list');
    if (manifests.length === 0) {
      list.innerHTML = '<li><em>No local manifests found.</em></li>';
      return;
    }
    list.innerHTML = '';
    for (const m of manifests) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#';
      a.addEventListener('click', (e) => { e.preventDefault(); goToManifest(m.url); });
      a.innerHTML = `<div class="manifest-label">${m.label}</div><div class="manifest-url">${m.url}</div>`;
      li.appendChild(a);
      list.appendChild(li);
    }
  }

  loadExamples();
</script>
